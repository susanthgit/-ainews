name: 🗞️ Nightly AI News

on:
  schedule:
    # Runs at midnight NZT (11:00 UTC during NZDT / 12:00 UTC during NZST)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Manual trigger button

permissions:
  contents: write
  id-token: write  # For Azure OIDC login

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: 📡 Fetch news (RSS + NewsAPI)
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python scripts/fetch_news.py

      - name: 🔐 Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🤖 Summarise with AI (Azure OpenAI)
        run: |
          # Get Azure AD token for Cognitive Services
          export AZURE_OPENAI_TOKEN=$(az account get-access-token --resource https://cognitiveservices.azure.com --query accessToken -o tsv)
          export AZURE_OPENAI_ENDPOINT="https://ainews-openai.openai.azure.com/"
          python scripts/summarise.py

      - name: 🎨 Generate HTML pages
        run: python scripts/generate_page.py

      - name: 💾 Commit generated files
        run: |
          git config user.name "AI News Bot"
          git config user.email "ainews-bot@aguidetocloud.com"
          git add site/
          git diff --cached --quiet || git commit -m "📰 Daily news update — $(date -u +%Y-%m-%d)" --author="AI News Bot <ainews-bot@aguidetocloud.com>"
          git pull --rebase --strategy-option=theirs || (git rebase --abort && git pull --no-rebase -X theirs)
          git push || true

      - name: 🔄 Update main website with latest news
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          # Clone the main site repo, update news data, push
          git clone https://x-access-token:${GH_TOKEN}@github.com/susanthgit/aguidetocloud-revamp.git /tmp/main-site
          cp site/summaries.json /tmp/main-site/static/data/ainews/latest.json
          cd /tmp/main-site
          git config user.name "AI News Bot"
          git config user.email "ainews-bot@aguidetocloud.com"
          git add static/data/ainews/latest.json
          git diff --cached --quiet || git commit -m "📰 AI News data update — $(date -u +%Y-%m-%d)"
          git push

      - name: 🚀 Deploy main website
        run: |
          # Install Hugo
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.159.1/hugo_extended_0.159.1_linux-amd64.tar.gz -O /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          # Build Hugo site
          cd /tmp/main-site
          /tmp/hugo --minify
          # Deploy with SWA CLI
          npm install -g @azure/static-web-apps-cli --quiet 2>/dev/null
          swa deploy /tmp/main-site/public --deployment-token ${{ secrets.MAIN_SITE_SWA_TOKEN }} --env production

      - name: 🚀 Deploy AI News standalone (legacy)
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "site"
          skip_app_build: true
          skip_api_build: true
