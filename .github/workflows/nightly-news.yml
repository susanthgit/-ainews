name: 🗞️ Nightly AI News

on:
  schedule:
    # 4x daily — every 6 hours aligned to NZ time zones
    - cron: '0 5 * * *'   # 6 PM NZT (NZST) / 6 PM NZDT → catches European business day
    - cron: '0 11 * * *'  # 12 AM NZT (midnight) → catches US business day
    - cron: '0 17 * * *'  # 6 AM NZT → catches overnight US news
    - cron: '0 23 * * *'  # 12 PM NZT (noon) → catches morning NZ/AU + late US
  workflow_dispatch:  # Manual trigger button

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: 📡 Fetch news (RSS + NewsAPI)
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python scripts/fetch_news.py

      - name: 🩺 Check feed health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          if [ -f site/broken_feeds.json ] && [ "$(cat site/broken_feeds.json)" != "[]" ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('site/broken_feeds.json'))))")
            BODY=$(python3 -c "
          import json
          feeds = json.load(open('site/broken_feeds.json'))
          lines = ['| Feed | Category | Error |', '|------|----------|-------|']
          for f in feeds:
              lines.append(f'| {f[\"name\"]} | {f[\"category\"]} | {f[\"error\"][:60]} |')
          print('\n'.join(lines))
          ")
            # Only create issue if one doesn't already exist with same title
            TITLE="🩺 $COUNT broken RSS feed(s) detected — $(date -u +%Y-%m-%d)"
            EXISTING=$(gh issue list --repo susanthgit/-ainews --search "broken RSS feed" --state open --json number --jq 'length')
            if [ "$EXISTING" = "0" ]; then
              gh issue create \
                --repo susanthgit/-ainews \
                --title "$TITLE" \
                --body "The AI News pipeline detected broken RSS feeds. Fix in \`scripts/feeds.json\`.

          $BODY

          Check [feeds.json](https://github.com/susanthgit/-ainews/blob/main/scripts/feeds.json) and update the broken URLs." \
                --label "bug"
              echo "⚠️ Created issue for $COUNT broken feed(s)"
            else
              echo "⚠️ $COUNT broken feed(s) — open issue already exists"
            fi
          else
            echo "✅ All feeds healthy"
          fi

      - name: 🔐 Login to Azure (OIDC — no expiring secrets)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🤖 Summarise with AI (Azure OpenAI)
        run: |
          # Get Azure AD token for Cognitive Services
          export AZURE_OPENAI_TOKEN=$(az account get-access-token --resource https://cognitiveservices.azure.com --query accessToken -o tsv)
          export AZURE_OPENAI_ENDPOINT="https://ainews-openai.openai.azure.com/"
          python scripts/summarise.py

      - name: 🎨 Generate HTML pages
        run: python scripts/generate_page.py

      - name: 💾 Commit generated files
        run: |
          git config user.name "AI News Bot"
          git config user.email "ainews-bot@aguidetocloud.com"
          git add site/
          git diff --cached --quiet || git commit -m "📰 Daily news update — $(date -u +%Y-%m-%d)" --author="AI News Bot <ainews-bot@aguidetocloud.com>"
          git pull --rebase --strategy-option=theirs || (git rebase --abort && git pull --no-rebase -X theirs)
          git push || true

      - name: 🔄 Update main website with latest news
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          # Clone the main site repo with token auth, update news data, push
          git clone https://x-access-token:${GH_TOKEN}@github.com/susanthgit/aguidetocloud-revamp.git /tmp/main-site
          mkdir -p /tmp/main-site/static/data/ainews
          cp site/summaries.json /tmp/main-site/static/data/ainews/latest.json
          # Copy weekly and monthly JSON for tab switching
          [ -f site/weekly.json ] && cp site/weekly.json /tmp/main-site/static/data/ainews/weekly.json
          [ -f site/monthly.json ] && cp site/monthly.json /tmp/main-site/static/data/ainews/monthly.json
          # Copy RSS feed if it exists
          [ -f site/feed.xml ] && cp site/feed.xml /tmp/main-site/static/data/ainews/feed.xml
          cd /tmp/main-site
          git config user.name "AI News Bot"
          git config user.email "ainews-bot@aguidetocloud.com"
          git add static/data/ainews/
          git diff --cached --quiet || git commit -m "📰 AI News data update — $(date -u +%Y-%m-%d)"
          git push

      # Git push above triggers Cloudflare Pages auto-build — no manual deploy needed

  notify-on-failure:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    needs: fetch-and-deploy
    if: failure()
    steps:
      - name: 🚨 Create failure issue
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          gh issue create \
            --repo susanthgit/-ainews \
            --title "🚨 AI News pipeline failed — $(date -u +%Y-%m-%d)" \
            --body "The nightly AI News workflow failed on $(date -u). Check the [workflow run](https://github.com/susanthgit/-ainews/actions) for details." \
            --label "bug"
